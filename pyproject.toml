[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "stock-charts"
version = "0.1.0"
description = "A CLI application for stock charts"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
stock-charts = "stock_charts.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
